[pytest]
asyncio_mode = auto
; The async engine (and its connection pool) is created once per session
; (see tests/conftest.py's _schema_ready fixture), but pytest-asyncio's
; default is a *new* event loop per test function -- mismatched, that
; produces "Event loop is closed" errors from asyncpg on the second test.
asyncio_default_fixture_loop_scope = session
